name: Deploy Hugo Site to DigitalOcean

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-hugo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.154.0'

      - name: Build Hugo site
        run: hugo --baseURL https://web1.bugelhartmann.dk/ --minify

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Add DigitalOcean host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 161.35.64.131 >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Sync site to DigitalOcean using rsync
        env:
          SSH_USER: jetty
          DO_DROPLET_IP: 161.35.64.131
          APP_NAME: web1
        run: |
          REMOTE_PATH="/home/$SSH_USER/deployment/site/$APP_NAME/"

          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./public/ "$SSH_USER@$DO_DROPLET_IP:$REMOTE_PATH"
